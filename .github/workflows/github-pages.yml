# 把 AURORA 站点发布到 GitHub Pages（仓库 kev-gii/first-project）
#
# 发布流程：push 到 main → 自动构建（Vite）→ 把 dist/ 交给 Pages 部署。
# 首次使用前需在 GitHub 仓库 Settings → Pages → Source 选择「GitHub Actions」，
# 之后每次 push 会自动发布。产物使用 base:"./"，可在 /first-project/ 子路径正常打开。

name: Deploy to GitHub Pages

on:
  # 推送到 main 自动发布
  push:
    branches: [main]
  # 允许在 GitHub 页面手动触发
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一仓库的 Pages 部署不并发，避免互相覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
